<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>皮肤套餐监控配置</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 20px; max-width: 820px; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px; }
  textarea { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .hint { color: #666; font-size: 12px; margin-top: 2px; }
  .row { margin-bottom: 6px; }
  button { margin-top: 16px; margin-right: 8px; padding: 8px 16px; cursor: pointer; }
  #status { margin-top: 14px; font-weight: 600; }
</style>
</head>
<body>
<h2>皮肤套餐监控 · 配置</h2>

<div class="row"><label>启用监控</label><input type="checkbox" id="enabled"></div>

<div class="row">
  <label>监控页面地址（支持 * 通配）</label>
  <input id="pattern" placeholder="https://id5.cbg.163.com/*">
  <div class="hint">匹配到的页面会被自动注入监控脚本（首页推荐流、搜索结果页均可）。</div>
</div>

<div class="row">
  <label>刷新间隔（秒，网易风控严，建议 ≥ 60）</label>
  <input id="intervalSec" type="number" value="60" min="1">
</div>

<div class="row"><label>整页刷新（关闭则仅定时重新扫描，不重载页面）</label><input type="checkbox" id="reload" checked></div>

<hr>

<div class="row">
  <label>账号卡容器选择器（匹配每一个卖号）</label>
  <input id="itemSelector" placeholder=".product-item.product-item-cards">
</div>
<div class="row">
  <label>皮肤名选择器（账号卡内，匹配每个皮肤名）</label>
  <input id="skinNameSelector" placeholder=".card-item .name-wrap .name">
</div>
<div class="row">
  <label>账号标题选择器（去重/展示，可选）</label>
  <input id="titleSelector" placeholder=".main-title">
</div>
<div class="row">
  <label>账号售价选择器（仅展示，可选）</label>
  <input id="accountPriceSelector" placeholder=".row-hd .price">
</div>

<hr>

<div class="row">
  <label>目标皮肤清单（每行一个：皮肤名,参考价）</label>
  <textarea id="skins" rows="10" placeholder="司药,30&#10;石榴碟小姐,50&#10;片刻闲暇,40"></textarea>
  <div class="hint">
    这里的价格是你自己的参考价（来自后续 Excel）。页面只判断账号“有没有”这些皮肤，价格用这里的数值求和。<br>
    支持直接粘贴 Excel 导出的 CSV（皮肤名,价格 每行一个）。点「导入CSV」可读取本地 .csv 文件。
  </div>
  <input type="file" id="csvFile" accept=".csv,text/csv" style="margin-top:6px;">
</div>

<div class="row">
  <label>合计参考价阈值（命中皮肤参考价之和 &lt; 该值才提醒）</label>
  <input id="threshold" type="number" value="100">
  <div class="hint">例：阈值 100，账号同时拥有「司药(30)+长夜(25)」合计 55 &lt; 100 → 提醒。</div>
</div>

<hr>

<div class="row">
  <label>企业微信机器人 Webhook 地址</label>
  <input id="webhook" placeholder="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxx">
</div>

<button id="save">保存并应用</button>
<button id="clear">清空已通知记录</button>
<button id="test">发送测试消息</button>
<div id="status"></div>

<script src="options.js"></script>
</body>
</html>
