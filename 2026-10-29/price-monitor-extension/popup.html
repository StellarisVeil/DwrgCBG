<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; width: 300px; margin: 0; padding: 16px; }
  h3 { margin: 0 0 4px; font-size: 15px; }
  #state { font-size: 12px; color: #666; margin-bottom: 12px; }
  .switchrow { display: flex; align-items: center; justify-content: space-between;
               padding: 8px 10px; background: #f5f6f8; border-radius: 6px; margin-bottom: 10px; }
  .switchrow label { font-size: 13px; font-weight: 600; cursor: pointer; }
  input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
  button { width: 100%; margin: 6px 0; padding: 10px; cursor: pointer; font-size: 13px;
           border: 1px solid #d0d3d9; border-radius: 6px; background: #fff; }
  button:hover { background: #f2f4f7; }
  #monitor { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; }
  #monitor:hover { background: #1d4ed8; }
  #status { margin-top: 10px; font-size: 12px; line-height: 1.5; color: #444; min-height: 16px; }
</style>
</head>
<body>
<h3>价格监控提醒</h3>
<div id="state">读取中…</div>

<div class="switchrow">
  <label for="enabled">启用监控</label>
  <input type="checkbox" id="enabled">
</div>

<button id="monitor">监控当前页面</button>
<button id="openOptions">打开配置</button>
<div id="status"></div>
<script src="popup.js"></script>
</body>
</html>
